# Counterpart of upstream's docker_variant_smoke_clustered (container_integration_tests/integration_tests.sh
# smoke_test_clustered, see ../../not-applicable.txt and docs/divergences.md): upstream boots its separate
# `-clustered` image variant; mock-server ships one image, so this boots the SUT image with
# MOCKSERVER_STATE_BACKEND=infinispan and no MOCKSERVER_CLUSTER_ENABLED (LOCAL mode).
services:
  mockserver:
    image: mockserver/mockserver:integration_testing
    environment:
      MOCKSERVER_STATE_BACKEND: infinispan
  client:
    image: mockserver/mockserver:integration_testing_client_curl
    command:
      - "sleep"
      - "86400"
