# Counterpart of upstream's docker_compose_libs_classpath (see ../../not-applicable.txt): the same initializer class,
# as the WASM callback plugin plugins/integration-testing, loaded from /libs.
services:
  mockserver:
    image: mockserver/mockserver:integration_testing
    environment:
      MOCKSERVER_LOG_LEVEL: DEBUG
      MOCKSERVER_INITIALIZATION_CLASS: org.mockserver.test.LibsTestInitializer
    volumes:
      - ${OVERRIDE_DIR}/libs:/libs
  client:
    image: mockserver/mockserver:integration_testing_client_curl
    command:
      - "sleep"
      - "86400"
