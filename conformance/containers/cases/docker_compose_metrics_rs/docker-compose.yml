# Counterpart of upstream's docker_compose_metrics (see ../../not-applicable.txt): the same services, the same
# Prometheus scrape of GET /mockserver/metrics and the same OTLP push to a second server acting as the sink.
services:
  mockserver:
    image: mockserver/mockserver:integration_testing
    command: -serverPort 1080
    environment:
      MOCKSERVER_METRICS_ENABLED: "true"
      MOCKSERVER_OTEL_METRICS_ENABLED: "true"
      MOCKSERVER_OTEL_ENDPOINT: "http://otlp-receiver:1080"
      MOCKSERVER_OTEL_METRICS_EXPORT_INTERVAL_SECONDS: "2"
      MOCKSERVER_LOG_LEVEL: "WARN"
    depends_on:
      - otlp-receiver

  otlp-receiver:
    image: mockserver/mockserver:integration_testing
    command: -serverPort 1080
    environment:
      MOCKSERVER_LOG_LEVEL: "WARN"

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ${OVERRIDE_DIR}/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  client:
    image: mockserver/mockserver:integration_testing_client_curl
    command: ["sleep", "86400"]
    depends_on:
      - mockserver
      - prometheus
      - otlp-receiver
