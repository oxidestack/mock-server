# The gate for mock-server on GitHub Actions, the only CI.
#
# - `container:` names a job's image, pinned by digest, and `timeout-minutes:` its deadline. The runners are
#   GitHub-hosted, two vCPUs on a private repository and four on a public one.
# - actions/cache keys on `hashFiles('Cargo.lock')`. Only the cargo registry and the Maven repository are cached, not
#   `target/`.
# - A failed job keeps its diagnostics as the run's artifacts (`if: failure()` steps).
# - `image` builds and tests the image natively on amd64 (`ubuntu-24.04`) and arm64 (`ubuntu-24.04-arm`), never
#   emulated (tools/ci/image-job.sh: a request answered, MockServer's Testcontainers tests against it, the SBOMs),
#   then its end-to-end suites (tools/ci/e2e-job.sh: the mixed cluster, upstream's docker-compose and helm cases);
#   `lint-commits` is the commit-message gate over a pull request's commits; `lint-actions` is this directory's own
#   gate. `tools-test` and `docker-tests` run on the runner itself, where Docker is.
# - Every test the repository has runs in one of these jobs, none skipped: a test that needs Docker runs where Docker
#   is, with MOCK_SERVER_REQUIRE_DOCKER=1, so a missing daemon fails it instead of skipping it.
#
# Every action is pinned by its full commit, its release in a comment; every checkout keeps no credential.

name: CI

# Every push to every branch and every pull request once the repository is public, and a manual run (`gh workflow
# run ci.yml`, or Actions → CI → Run workflow) at any time.
#
# While the repository is private, a push or a pull request starts no job: every job carries the same `if:`, so such
# a run is all skipped and bills no minute, and a manual run is the whole CI. Publishing the repository turns the
# automatic runs on with no edit here.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer run of the same kind on the same branch (or pull request) cancels this workflow's run still going there, but
# on `main`, where each push keeps its whole result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing at the top: each job is granted what it uses, `contents: read` for actions/checkout.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # A job never makes a second build in the same tree, so incremental artifacts are cache weight only.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # A job container runs as root on a workspace the runner's user owns, which git refuses as a dubious ownership.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  test:
    # lib, the oracle scenarios (replayed against their goldens) and the Rust ports of upstream tests; every test
    # binary runs even after one fails. Trixie, not bookworm: the k8s webhook's DSA tests drive `openssl s_client`,
    # and need OpenSSL 3.5 (bookworm has 3.0, without the ML-KEM groups and with another output). Every package of the
    # workspace (the webhook's own unit tests, the plugins'). The job container has no Docker: the process scenarios
    # that run the oracle image, and the tests against containers, run in `docker-tests`.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.98.0-trixie@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
    timeout-minutes: 120
    env:
      # The callback-class scenarios build the integration-testing callbacks as a WASM plugin with a rustup toolchain
      # (`stable` locally); the image has only its own, named after its version.
      MOCK_SERVER_WASM_TOOLCHAIN: 1.98.0
      # Two compile/link processes at a time: each `ld` of a test binary holds 2.3-2.5 GB. Only the build is capped;
      # the tests still run on every CPU.
      CARGO_BUILD_JOBS: "2"
      # Debug info is most of a test build's size on the runner's disk; file and line in a backtrace are kept.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: git submodule update --init --depth 1 upstream/mockserver
      - run: rustup target add wasm32-unknown-unknown
      # Each scenario's actual answers, shaped like its golden, for comparing a failure without rerunning it.
      - run: |
          export MOCK_SERVER_DUMP="$PWD/scenario-actuals"
          mkdir -p "$MOCK_SERVER_DUMP"
          cargo test --locked --workspace --no-fail-fast
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-diagnostics
          path: |
            scenario-actuals/
            target/upstream-scenario-diffs.txt
            target/upstream-scenario-results.tsv
          retention-days: 7
          if-no-files-found: ignore

  dashboard:
    # The dashboard bundle build.rs embeds, built as upstream's `build-ui` profile does (node 22.14.0). The full image:
    # the script needs git, python3 and shasum. Only upstream/mockserver: the build reads nothing else.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: node:22.14.0-bookworm@sha256:e5ddf893cc6aeab0e5126e4edae35aa43893e2836d1d246140167ccc2616f5d7
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 upstream/mockserver
      - run: scripts/build-dashboard.sh
      # The third-party notices are generated from what the bundle contains; a stale committed copy is a failure.
      - run: git diff --exit-code -- DASHBOARD-THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dashboard
          path: dashboard/
          retention-days: 1
          if-no-files-found: error

  conformance:
    # MockServer's own suites T1–T5, unmodified, against the release binary (target `rs-process`). JDK 17 and Maven
    # come from Debian so the job stays on the image that builds the binary.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    needs: [dashboard]
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /root/.m2/repository
          key: conformance-${{ hashFiles('Cargo.lock', 'conformance/upstream/pom.xml', 'java-launcher/pom.xml') }}
      - run: git submodule update --init --depth 1 upstream/mockserver
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dashboard
          path: dashboard
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless maven >/dev/null
      # The commit `mock_server_native_build_info{git_hash}` reports; build.rs writes `unknown` without it.
      - run: MOCK_SERVER_GIT_HASH="$(git rev-parse --short=8 HEAD)" cargo build --locked --release
      - run: cargo build --locked --release -p mock-server-integration-testing-callbacks
      - run: cd conformance/upstream && mvn -B -q test -Dtarget=rs-process
      # The Java launcher (`make java-launcher`): upstream's own tests of ClientAndServer, the JUnit rule and extension,
      # the Spring listener and starter, over the same release binary. `verify`: nothing is installed.
      - run: cd java-launcher && mvn -B -q verify -DmockServerBin="$GITHUB_WORKSPACE/target/release/mock-server" -DrsCallbackPluginDir="$GITHUB_WORKSPACE/target/release"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conformance-reports
          path: |
            conformance/upstream/target/surefire-reports/rs-process/
            conformance/upstream/target/server-logs/rs-process/
            java-launcher/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  image:
    # The image built and tested on each architecture's own runner (tools/ci/image-job.sh), then kept for its
    # end-to-end suites (tools/ci/e2e-job.sh). The runner's VM has its own Docker, so the tests reach the container on
    # the VM's loopback.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # actions/checkout reads the repository
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The image's build stages outgrow the runner's free disk: drop the toolchains preinstalled for other
      # languages, none of which the job uses.
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: git submodule update --init --depth 1 upstream/mockserver
      # MockServer's Testcontainers tests (conformance/java) compile for Java 21.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless maven > /dev/null
          # The runner's JAVA_HOME names its own preinstalled JDK 17, which mvn would take.
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-$(dpkg --print-architecture)" >> "$GITHUB_ENV"
      - run: sh tools/ci/image-job.sh
        env:
          IMAGE_KEEP: "1"
      - run: bash tools/ci/e2e-job.sh
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-${{ matrix.arch }}
          path: |
            conformance/cluster/target/runs/
            conformance/containers/target/results-rs.tsv
          retention-days: 7
          if-no-files-found: ignore

  docker-tests:
    # The tests that need a Docker daemon next to them, on the runner itself (no job container: the daemon must see the
    # checkout at its own paths): the process scenarios that run the oracle image (`oracleDocker`), and every
    # `"target": "both"` scenario once more against the oracle (MOCK_SERVER_PROCESS_ORACLE), proving its golden is still
    # the oracle's; the AsyncAPI live-broker ports (`make broker-tests`) and the blob store ports against their
    # emulators (`make blob-tests`); the OTLP exports decoded by the reference protobuf classes
    # (scripts/verify-otlp-*.sh); the original-destination resolvers in privileged containers (`make
    # proxy-resolver-e2e`). MOCK_SERVER_REQUIRE_DOCKER makes a missing Docker a failure, not a skip, and STRICT a
    # resolver case the kernel cannot run. The runner's own architecture, natively; nothing here names one.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      MOCK_SERVER_REQUIRE_DOCKER: "1"
      MOCK_SERVER_PROCESS_ORACLE: "1"
      MOCK_SERVER_BROKER_TESTS: "1"
      MOCK_SERVER_BLOB_TESTS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: docker-tests-cargo-${{ hashFiles('Cargo.lock') }}
      # The test builds and the containers' images outgrow the runner's free disk: drop the toolchains preinstalled for
      # other languages, none of which the job uses.
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: git submodule update --init --depth 1 upstream/mockserver
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --locked --test process_scenarios
      - run: cargo test --locked --no-fail-fast --test upstream -- live_broker blob_
      - run: bash scripts/verify-otlp-metrics.sh
      - run: bash scripts/verify-otlp-trace.sh
      - run: STRICT=1 bash scripts/proxy-resolver-e2e.sh all

  site:
    # The documentation site (`make site`, site/build.sh): the lockfile's licences, the Benchmarks page generator's
    # tests, the build, which fails on a broken internal link or anchor; then the version injector's tests
    # (site/versions/inject.test.mjs). The node image `make site` pins.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sh site/build.sh
      - run: node --test site/versions/inject.test.mjs

  clippy:
    # Clippy on every target, warnings as errors (CONTRIBUTING.md "The checks"). No lint is turned off package-wide; an
    # allow sits on the item it concerns, with its reason.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: git submodule update --init --depth 1 upstream/mockserver
      - run: rustup component add clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  licenses:
    # The CNCF third-party licence policy (`make licenses`): third_party/ byte for byte as third_party/MANIFEST
    # records it, every crate of the Cargo graph against deny.toml, then the dashboard's npm packages and
    # java-launcher's Maven dependencies against the same allowlist (tools/check-noncargo-licenses.py).
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin/cargo-deny
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
          key: licenses-cargo-deny-0.20.2-${{ hashFiles('Cargo.lock') }}
      - run: git submodule update --init --depth 1 upstream/mockserver
      - run: sh tools/check-third-party.sh
      # The cache restores the binary without cargo's install record, which `cargo install` would refuse to overwrite.
      - run: cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.20.2' || cargo install cargo-deny --version 0.20.2 --locked --force
      - run: cargo deny --locked check licenses
      - run: python3 tools/check-noncargo-licenses.py npm
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless maven >/dev/null
      # Maven's local repository named on both sides: in a job container mvn takes root's home, while $HOME (which the
      # script's default follows) is the runner's.
      - run: mvn -B -q -Dmaven.repo.local=/tmp/m2 -f java-launcher/pom.xml dependency:list -DincludeScope=runtime -DoutputFile=/tmp/java-launcher-deps.txt
      - run: python3 tools/check-noncargo-licenses.py maven --list /tmp/java-launcher-deps.txt --repo /tmp/m2

  harvest-tests:
    # harvest.py's own tests: a re-harvest keeps what was added to a B file by hand. Standard library only.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 conformance/harvest/test_harvest.py

  release-check:
    # The release gate for the upgrade guide (`make release-check`): its tests, then the tree's Unreleased section.
    # A release tag is checked by .github/workflows/release.yml (tools/ci/release.sh check).
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts
      - run: sh scripts/release-check.sh

  tools-test:
    # The tests of tools/ (`make tools-test`), on the runner itself, where Docker is: the release-notes drafts run
    # git-cliff in its pinned container with a bind mount, which must name a path the daemon sees.
    # MOCK_SERVER_REQUIRE_DOCKER makes a missing Docker a failure, not a skip.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    timeout-minutes: 10
    env:
      MOCK_SERVER_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The publication gate's tests run tools/public/public_check.py, which searches with ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: make tools-test

  public-check:
    # The publication gate's built-in half (`make public-check`, tools/public/): local paths, internal hosts and
    # references to the worklog in the tracked files, without the denylist, which is never in a job. Then its own
    # tests. A finding fails the run.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    timeout-minutes: 5
    steps:
      - run: apk add --no-cache make git ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make public-check PUBLIC_DENYLIST=none
      - run: python3 -m unittest discover -s tools/public

  lint-commits:
    # The commit messages after the base (tools/lint/commits.py, CONTRIBUTING.md "Commit messages"): a pull request's
    # own base, else commits.py's BASE, the public history's root. So the whole history, and a pull request's head
    # rather than the merge commit GitHub makes, which the `merge` rule would refuse. This job is the DCO check: every
    # commit's last footer is its author's `Signed-off-by:`.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    timeout-minutes: 5
    env:
      COMMITS_BASE: ${{ github.event.pull_request.base.sha }}
      COMMITS_SIGNOFF: "1"
    steps:
      - run: apk add --no-cache make git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: make commits-check

  lint-actions:
    # actionlint and zizmor on .github/ (tools/ci/lint-actions.sh); the rust image for zizmor's glibc.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sh tools/ci/lint-actions.sh
