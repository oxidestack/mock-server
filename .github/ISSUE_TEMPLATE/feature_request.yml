name: Feature request
description: Something mock-server does not do yet.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Not sure yet what you need, or how it should work? Start in
        [Ideas](https://github.com/oxidestack/mock-server/discussions/categories/ideas). Something MockServer does and
        this server does not is a bug: please open a bug report instead.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A matcher, an action, a setting, a metric, a client — whatever you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: A workaround, or how another tool does it.
