name: Bug report
description: An answer that differs from MockServer's, a request that does not match, or a server that misbehaves.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for the report. A question rather than a bug belongs in
        [Discussions](https://github.com/oxidestack/mock-server/discussions/categories/q-a), and a vulnerability in a
        [private report](https://github.com/oxidestack/mock-server/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or digest, or the commit you built.
      placeholder: quay.io/oxidestack/mock-server:9.2.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How it runs
      options:
        - docker run
        - Testcontainers
        - Docker Compose
        - Helm chart
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings changed from their defaults
      description: The `MOCKSERVER_*` variables, the properties file, the command-line arguments. Leave out any secret.
      render: shell
  - type: textarea
    id: expectation
    attributes:
      label: The expectations
      description: The expectations the server held, as JSON (`PUT /mockserver/retrieve?type=active_expectations`).
      render: json
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: The request
      description: The `curl` command or the client code that sent it.
      render: shell
      placeholder: curl -v http://localhost:1080/some/path
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The answer
      description: The status, the headers and the body the server returned.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: >-
        What MockServer's own image answers to the same request, if you can run it
        (`docker run -p 1080:1080 mockserver/mockserver`): a difference from MockServer is the most useful report
        there is.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server's log lines around the request.
      render: text
