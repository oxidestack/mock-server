mockserver.maxExpectations=5
mockserver.maxLogEntries=100
mockserver.metricsEnabled=true
mockserver.disableLogging=false
mockserver.corsAllowOrigin=*
mockserver.watchInitializationJson=false
mockserver.llmApiKey=sk-secret
mockserver.maxFutureTimeout=7
mockserver.useSemicolonAsQueryParameterSeparator=true
mockserver.attemptToProxyIfNoMatchingExpectation=false
mockserver.sslSubjectAlternativeNameDomains=a.example,b.example
mockserver.matchersFailFast=true
mockserver.enableCORSForAPI=true
mockserver.maxSocketTimeout=1234
