# values for the mockserver dependency
mockserver:
  image:
    repositoryNameAndTag: mockserver/mockserver:graaljs-8.0.0
  app:
    logLevel: INFO
    # heap and worker threads for the JVM
    jvmOptions: "-Xmx512m"
    extraEnv:
      - name: MOCKSERVER_NIO_EVENT_LOOP_THREAD_COUNT
        value: "2"
      - name: MOCKSERVER_MAX_LOG_ENTRIES
        value: "5000"
    config:
      enabled: true
      properties: |
        mockserver.metricsEnabled=true
        mockserver.javascriptDisallowedText=eval
  clustering:
    enabled: false
