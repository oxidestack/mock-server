# values for the mockserver dependency
mockserver:
  image:
    repositoryNameAndTag: mockserver/mockserver:graaljs-8.0.0
  app:
    logLevel: INFO
    # heap and worker threads for the JVM
    jvmOptions: "-Xmx512m -XX:ActiveProcessorCount=2 -Dmockserver.maxLogEntries=5000"
    extraEnv: []
    config:
      enabled: true
      properties: |
        mockserver.metricsEnabled=true
        mockserver.javascriptDisallowedText=eval
  clustering:
    enabled: false
