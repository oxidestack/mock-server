# OpenSSF Security Insights (https://github.com/ossf/security-insights), schema 2.2.0: what the project says about
# its own security, for tools and people who assess it (CLOMonitor reads it from this path).
header:
  schema-version: 2.2.0
  last-updated: "2026-11-17"
  last-reviewed: "2026-11-17"
  url: https://raw.githubusercontent.com/oxidestack/mock-server/main/security-insights.yml

project:
  name: mock-server
  homepage: https://oxidestack.github.io/mock-server/
  roadmap: https://github.com/oxidestack/mock-server/blob/main/ROADMAP.md
  administrators:
    - name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
  repositories:
    - name: mock-server
      url: https://github.com/oxidestack/mock-server
      comment: The server, its container image, the Java launcher, the Kubernetes admission webhook and the documentation.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/oxidestack/mock-server/blob/main/SECURITY.md
    contact:
      name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
    comment: >-
      Report a vulnerability through GitHub's private vulnerability reporting, on the repository's Security tab, never
      in a public issue. Fixes go into the latest release.
    in-scope:
      - The server's control plane and data plane, its listeners, the callback plugins it loads and the dashboard it serves.
      - The container image as published.
    out-of-scope:
      - A vulnerability in MockServer itself, which belongs to the MockServer project.
      - An unauthenticated control plane exposed to an untrusted network, which is a deployment decision.
  documentation:
    quickstart-guide: https://github.com/oxidestack/mock-server#quick-start
    detailed-guide: https://oxidestack.github.io/mock-server/
    code-of-conduct: https://github.com/oxidestack/mock-server/blob/main/CODE_OF_CONDUCT.md
    support-policy: https://github.com/oxidestack/mock-server/blob/main/SECURITY.md#supported-versions

repository:
  url: https://github.com/oxidestack/mock-server
  # repostatus.org: under active development, not yet released.
  status: wip
  accepts-change-request: true
  accepts-automated-change-request: false
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
  license:
    url: https://github.com/oxidestack/mock-server/blob/main/LICENSE
    expression: Apache-2.0 AND CC-BY-4.0
  documentation:
    contributing-guide: https://github.com/oxidestack/mock-server/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/oxidestack/mock-server/blob/main/GOVERNANCE.md#dependencies
    governance: https://github.com/oxidestack/mock-server/blob/main/GOVERNANCE.md
    review-policy: https://github.com/oxidestack/mock-server/blob/main/GOVERNANCE.md#how-decisions-are-made
    security-policy: https://github.com/oxidestack/mock-server/blob/main/SECURITY.md
  security:
    assessments:
      self:
        comment: No self-assessment has been published yet.
    champions:
      - name: Vitaly Kustov
        email: kustov.vitalik@gmail.com
        social: https://github.com/kustov-vitalik
        primary: true
    tools:
      - name: cargo-deny
        type: SCA
        comment: Licences against the CNCF allowlist, advisories, yanked and unmaintained crates, crate sources.
        rulesets:
          - deny.toml
        integration:
          adhoc: false
          ci: true
          release: true
        results: {}
  release:
    # The release pipeline is not in place yet; no release has been made.
    automated-pipeline: false
    distribution-points:
      - uri: oci://quay.io/oxidestack/mock-server
        comment: The container image, the primary registry, which a release stands on.
      - uri: https://github.com/oxidestack/mock-server/releases
        comment: Each version's notes.
      - uri: oci://ghcr.io/oxidestack/mock-server
        comment: The mirror, with the same digests as quay.io; a release does not wait for it.
    changelog: https://github.com/oxidestack/mock-server/blob/main/CHANGELOG.md
